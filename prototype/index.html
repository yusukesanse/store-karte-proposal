<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>店舗カルテ プロトタイプ v0.1｜エイトデザイン</title>
<style>
:root{
  color-scheme: light;
  --surface:#fcfcfb; --page:#f4f4f1; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --navy:#1f3864; --navy2:#305496;
  --c1:#C55A11; --c2:#2E75B6; --c3:#548235; --c4:#7030A0;
  --seq:#2a78d6; --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --input-bg:#fffdf5; --input-bd:#d8d5c9; --card:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface:#1a1a19; --page:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --navy:#8fb0dd; --navy2:#a9c3e8;
    --c1:#D4712B; --c2:#4A8FD4; --c3:#6FA24A; --c4:#9A5BC8;
    --seq:#3987e5; --input-bg:#22221f; --input-bd:#44443f; --card:#232322;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  font-size:15px;line-height:1.55}
.head{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:10px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head .ttl{font-weight:700;font-size:16px}
.head .proto{font-size:10px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:99px;letter-spacing:.08em}
.head .store{font-size:13px;opacity:.92}
.head .stats{margin-left:auto;display:flex;gap:14px;font-size:12px;align-items:center}
.head .stats b{font-size:16px}
.tabs{position:sticky;top:46px;z-index:29;display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{flex:1;min-width:92px;padding:11px 8px;border:0;background:none;color:var(--ink2);
  font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
.tabs button.on{color:var(--navy2);border-bottom-color:var(--navy2)}
main{max-width:1100px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--navy2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
label.f{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=date],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--input-bd);
  border-radius:8px;background:var(--input-bg);color:var(--ink);font-size:16px;font-family:inherit}
textarea{resize:vertical;min-height:56px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);outline-offset:0;border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-size:28px;font-weight:700;line-height:1.2;margin-top:2px}
.tile .s{font-size:11px;color:var(--ink2)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;color:#fff}
.b-S{background:var(--seq)} .b-A{background:var(--good)} .b-B{background:var(--warn);color:#3a2c00} .b-C{background:var(--crit)} .b-N{background:var(--muted)}
.alert{border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700;display:flex;gap:10px;align-items:center;border:1px solid var(--border);background:var(--card);color:var(--ink2)}
.alert.crit{background:var(--crit);color:#fff;border:0}
.alert.warn{background:var(--serious);color:#fff;border:0}
.alert.ok{border-left:6px solid var(--good)}
.alert .ic{font-size:18px}
.pbar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;flex:1}
.pbar i{display:block;height:100%;background:var(--seq);border-radius:4px;transition:width .25s}
.prow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;cursor:pointer}
.prow .nm{width:11em;color:var(--ink2);display:flex;gap:6px;align-items:center}
.prow .pc{width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.cat0{background:var(--c1)}.cat1{background:var(--c2)}.cat2{background:var(--c3)}.cat3{background:var(--c4)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border:1px solid var(--input-bd);background:var(--card);border-radius:99px;padding:7px 13px;font-size:12.5px;
  cursor:pointer;color:var(--ink2);font-weight:600;display:flex;gap:6px;align-items:center;font-family:inherit}
.chip.on{border-color:var(--navy2);color:var(--navy2);box-shadow:inset 0 0 0 1px var(--navy2)}
.catlbl{font-size:11px;color:var(--muted);margin-top:10px;font-weight:700}
.item{border-top:1px solid var(--grid);padding:13px 0}
.item:first-child{border-top:0}
.item .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .no{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .lb{font-weight:700;font-size:14px}
.item .fmt{font-size:11.5px;color:var(--muted)}
.item .src{font-size:11px;color:var(--muted);margin-top:2px}
.irow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.irow3{display:grid;grid-template-columns:110px 1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:640px){.irow{grid-template-columns:1fr}.irow3{grid-template-columns:1fr 1fr}}
.auto-v{background:var(--grid);border-radius:8px;padding:9px 10px;font-size:15px;color:var(--ink2)}
select.st{font-size:13px;font-weight:700;padding:7px 8px}
.st-未着手{color:var(--muted)} .st-調査中{color:var(--c2)} .st-確認待ち{color:#b8860b} .st-完了{color:var(--good)} .st-対象外{color:var(--muted)}
.shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.shead h2{font-size:16px;margin:0;color:var(--navy2)}
.snav{display:flex;gap:8px;margin:14px 0 0}
.snav button{flex:1;padding:11px;border:1px solid var(--input-bd);background:var(--card);border-radius:9px;font-size:13.5px;cursor:pointer;color:var(--ink2);font-family:inherit;font-weight:600}
.ax{border-top:1px solid var(--grid);padding:12px 0}
.ax .nm{font-weight:700;font-size:14px}
.ax .pt{font-size:11.5px;color:var(--muted)}
.rate{display:flex;gap:6px;margin-top:8px}
.rate button{width:44px;height:40px;border:1px solid var(--input-bd);background:var(--input-bg);border-radius:8px;
  font-size:15px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.rate button.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
details.cr{margin-top:6px;font-size:11.5px;color:var(--ink2)}
details.cr summary{cursor:pointer;color:var(--muted)}
details.cr .cg{display:grid;grid-template-columns:2.2em 1fr;gap:2px 8px;margin-top:4px}
.wrow{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.wrow>div{flex:1;min-width:110px}
.wsum{font-size:12px;font-weight:700}
.wsum.ng{color:var(--crit)}
.matrix{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
.matrix td,.matrix th{border:1px solid var(--grid);padding:6px;text-align:center}
.matrix th{background:var(--page);color:var(--ink2);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 16px;border-radius:9px;border:1px solid var(--input-bd);
  background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
@media(max-width:640px){.head{position:static}.tabs{top:0}}
.btn.pri{background:var(--navy2);border-color:var(--navy2);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--ink2)}
.ovgrid{display:grid;grid-template-columns:8em 1fr;gap:4px 10px;font-size:12.5px}
.ovgrid .k{color:var(--muted)}
.radar-wrap{display:flex;justify-content:center}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;
  padding:6px 9px;border-radius:7px;opacity:0;transition:opacity .12s;z-index:99;max-width:240px}
.savebar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
  padding:8px 14px;display:flex;gap:10px;align-items:center;z-index:28;font-size:12px;color:var(--muted)}
.savebar .sp{flex:1}
footer{display:none}
@media print{
  .head,.tabs,.savebar,.snav{display:none!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .card{break-inside:avoid;border-color:#ccc}
}
</style>
</head>

}
function totalProg(){ return M.sheets.reduce((s,sh)=>s+sheetProg(sh),0)/M.sheets.length; }

/* ---- スコアリング ---- */
function catAvg(c){
  const xs = M.axes.filter(a=>a.cat===c).map(a=>S.scores[a.no]).filter(v=>v>=1);
  return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null;
}
function totalScore(){
  /* Excel版と同一：4カテゴリすべてに1軸以上の入力があれば算出 */
  const cs=["A","B","C","D"];
  if(cs.some(c=>catAvg(c)===null)) return null;
  let t=0; cs.forEach(c=>{ t += catAvg(c)*S.weights[c]/5; });
  return Math.round(t*10)/10;
}
function taishinFlag(){
  const k=val("1-2-01"), h=val("1-2-06");
  if(!k) return {cls:"", ic:"", txt:"耐震区分 未入力（1-2）"};
  if(k==="新耐震") return {cls:"ok", ic:"✓", txt:"新耐震：優先補強の対象外"};
  if(k==="不明") return {cls:"warn", ic:"！", txt:"【要確認】耐震区分が不明（建築確認申請日を確認）"};
  if(h==="実施済") return {cls:"ok", ic:"✓", txt:"旧耐震・補強済：経過観察（劣化状況に応じ再評価）"};
  return {cls:"crit", ic:"⚠", txt:"【最優先】旧耐震・補強未了：耐震診断・補強を最優先で検討"};
}
function autoJudge(){
  const a=catAvg("A"), c=catAvg("C");
  if(a===null||c===null) return null;
  if(c>=3&&a>=3) return "A：継続投資（計画的リニューアル）";
  if(c>=3&&a<3)  return "S：戦略投資（大規模改修・建替え候補）";
  if(c<3&&a>=3)  return "B：維持投資（最小限の投資で現状維持）";
  return "C：再編検討（統合・移転・閉鎖を含め検討）";
}

/* ---- レーダーチャート（SVG） ---- */
function drawRadar(){
  const el=$("#radar"); if(!el) return;
  const cats=["A","B","C","D"], W=360, H=252, cx=W/2, cy=H/2+6, R=88;
  const pt=(i,r)=>{ const ang=-Math.PI/2 + i*Math.PI/2; return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)]; };
  let g="";
  for(let lv=1;lv<=5;lv++){
    const ps=cats.map((_,i)=>pt(i,R*lv/5).join(",")).join(" ");
    g+=`<polygon points="${ps}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;
  }
  cats.forEach((_,i)=>{ const [x,y]=pt(i,R); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`; });
  const vals=cats.map(c=>catAvg(c));
  const has=vals.some(v=>v!==null);
  if(has){
    const ps=vals.map((v,i)=>pt(i,R*(v||0)/5));
    g+=`<polygon points="${ps.map(p=>p.join(",")).join(" ")}" fill="var(--seq)" fill-opacity=".14" stroke="var(--seq)" stroke-width="2" stroke-linejoin="round"/>`;
    ps.forEach((p,i)=>{ if(vals[i]!==null){
      g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--seq)" stroke="var(--surface)" stroke-width="2" data-ax="${cats[i]}" style="cursor:pointer"/>`;
      const lp=(i===1||i===3)?[p[0],p[1]-13]:pt(i,R*(vals[i])/5+14);
      g+=`<text x="${lp[0]}" y="${lp[1]+4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${vals[i].toFixed(1)}</text>`;
    }});
  } else {
    g+=`<text x="${cx}" y="${cy}" text-anchor="middle" font-size="11" fill="var(--muted)">スコア入力後に表示</text>`;
  }
  const lbl=[["A 建物・安全性",cx,cy-R-10],["B 施設機能",cx+R+10,cy,"start"],["C 商圏・将来性",cx,cy+R+16],["D 資産・投資",cx-R-10,cy,"end"]];
  lbl.forEach(([t,x,y,an])=>{ g+=`<text x="${x}" y="${y+4}" text-anchor="${an||"middle"}" font-size="10.5" fill="var(--ink2)">${t}</text>`; });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:340px" role="img" aria-label="カテゴリ別スコアのレーダーチャート">${g}</svg>`;
  el.querySelectorAll("[data-ax]").forEach(c=>{
    c.addEventListener("pointerenter",e=>{ const ax=e.target.dataset.ax;
      showTip(e,`${ax} ${M.catShort[ax]}：${catAvg(ax).toFixed(2)}点（重み${S.weights[ax]}%）`); });
    c.addEventListener("pointerleave",hideTip);
  });
}
function showTip(e,txt){ const t=$("#tip"); t.textContent=txt; t.style.opacity=1;
  t.style.left=Math.min(e.clientX+12,innerWidth-250)+"px"; t.style.top=(e.clientY+14)+"px"; }
function hideTip(){ $("#tip").style.opacity=0; }

  if(t.dataset.i){ const d=item(t.dataset.i); d[t.dataset.f]=t.value;
    if(t.dataset.f==="st"){ t.className="st st-"+t.value;
      const sh=M.sheets.find(s=>s.id===curSheet), p=Math.round(sheetProg(sh)*100);
      const bar=$("#shBar"), pc=$("#shPc"); if(bar){bar.style.width=p+"%"; pc.textContent=p+"%";}
    }
    document.querySelectorAll("[data-autocell]").forEach(el=>{ el.textContent=autoVal(el.dataset.autocell)||"（自動計算）"; });
    updateHead(); return; }
  if(t.dataset.w){ const v=parseInt(t.value)||0; S.weights[t.dataset.w]=v;
    const ws=S.weights.A+S.weights.B+S.weights.C+S.weights.D, el=$("#wsum");
    el.textContent="合計 "+ws+(ws===100?"":"（100に調整してください）"); el.className="wsum "+(ws===100?"":"ng"); updateHead(); return; }
  if(t.dataset.reason!==undefined){ S.reasons[t.dataset.reason]=t.value; return; }
  if(t.dataset.pm!==undefined){ S.pm=t.value; updateHead(); return; }
  if(t.dataset.pmreason!==undefined){ S.pmReason=t.value; return; }
});
$("#view").addEventListener("change", e=>{
  if(e.target.dataset.pm!==undefined){ S.pm=e.target.value; dirty=true; renderScore(); updateHead(); }
});

/* ---- 保存・読込 ---- */
function saveJSON(){
  const data=JSON.stringify({app:"store-karte-proto",ver:"0.1",saved:new Date().toISOString(),state:S},null,1);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  const nm=(S.meta.storeNo||"店舗")+"_"+(S.meta.storeName||"カルテ").replace(/[\\/:*?"<>|]/g,"");
  a.download=`カルテ_${nm}_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href); dirty=false; updateHead();
}
function loadJSON(file){
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d.state||d.app!=="store-karte-proto") throw new Error("形式が違います");
      S=Object.assign(blankState(),d.state); dirty=false; render();
    }catch(err){ alert("読み込みに失敗しました："+err.message); } };
  r.readAsText(file);
}
function bindDataButtons(){
  document.body.addEventListener("click", e=>{
    const id=e.target.id;
    if(id==="btnSave"||id==="btnSave2") saveJSON();
    if(id==="btnLoad") $("#file").click();
    if(id==="btnDemo"||id==="btnDemo2"){ if(!dirty||confirm("現在の入力を破棄してデモデータを読み込みますか？")){ S=Object.assign(blankState(),JSON.parse(JSON.stringify(DEMO))); dirty=false; curView="dash";
      document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x.dataset.v==="dash")); render(); scrollTo(0,0);} }
    if(id==="btnClear"){ if(confirm("すべての入力を消去します。よろしいですか？")){ S=blankState(); dirty=false; render(); } }
    if(id==="btnPrint"){ curView="dash"; document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x.dataset.v==="dash")); render(); setTimeout(()=>print(),150); }
  });
  $("#file").addEventListener("change", e=>{ if(e.target.files[0]) loadJSON(e.target.files[0]); e.target.value=""; });
}
addEventListener("beforeunload", e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });
bindDataButtons();
render();
</script>
</body>
